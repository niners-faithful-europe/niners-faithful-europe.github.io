name: NEG-Archiv einlesen (einmalig)
on:
  workflow_dispatch:
    inputs:
      after:
        description: 'Beiträge ab Datum (JJJJ-MM-TT)'
        default: '2024-11-01'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 src/archive_scan.py "${{ inputs.after }}"
      - name: Ergebnis auf Branch scan sichern
        run: |
          git config user.name "nfe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B scan
          git add -f scan/neg-archive.json
          git commit -m "NEG-Archiv eingelesen"
          git push -f origin scan
