name: Import und Veröffentlichung

on:
  schedule:
    - cron: '17 5 * * *'   # täglich 6:17 Uhr MEZ: neue Beiträge als Entwurf holen
  workflow_dispatch:
  push:
    branches: [main]       # jede Änderung, auch aus der Redaktion unter /admin/, veröffentlicht neu

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Neue Beiträge als Entwurf importieren
        if: github.event_name != 'push'
        run: |
          python3 src/import_feeds.py
          git config user.name "nfe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine neuen Daten"; else git commit -m "Import: neue Entwürfe" && git pull --rebase -q && git push; fi
      - name: Seite bauen
        env:
          NFE_BASE: ${{ vars.NFE_BASE || '/niners-faithful-europe' }}
        run: python3 src/build.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
